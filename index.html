<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you go out with me?</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- SCREEN 1: Intro -->
    <div id="screen-1" class="screen active">
        <button class="pink-btn action-btn btn-s1" onclick="nextScreen(2)">Lets do this</button>
    </div>

    <!-- SCREEN 2: The Question -->
    <div id="screen-2" class="screen">
        <div class="btn-group-s2">
            <button class="pink-btn" onclick="nextScreen(3)">Yes</button>
            <button id="no-btn" class="pink-btn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <!-- SCREEN 3: Reaction -->
    <div id="screen-3" class="screen">
        <button class="pink-btn action-btn btn-s3" onclick="nextScreen(4)">Continue</button>
    </div>

    <!-- SCREEN 4: Spoiled Choices -->
    <div id="screen-4" class="screen">
        <div class="vertical-btns">
            <button class="pink-btn" onclick="nextScreen(5)">Movie</button>
            <button class="pink-btn" onclick="nextScreen(5)">Coffee</button>
            <button class="pink-btn" onclick="nextScreen(5)">Ice cream</button>
            <button class="pink-btn" onclick="nextScreen(5)">Bowling</button>
        </div>
    </div>

    <!-- SCREEN 5: Flowers & Chocolates -->
    <div id="screen-5" class="screen">
        <div class="grid-btns">
            <button class="pink-btn" onclick="nextScreen(6)">Roses 🌹</button>
            <button class="pink-btn" onclick="nextScreen(6)">Sunflowers 🌻</button>
            <button class="pink-btn" onclick="nextScreen(6)">Tulips or Lilies 🌷</button>
            <button class="pink-btn" onclick="nextScreen(6)">chocolates 🍫</button>
        </div>
    </div>

    <!-- SCREEN 6: Final Outro -->
    <div id="screen-6" class="screen">
        <!-- Final screen displays the background image with no extra buttons needed -->
    </div>

    <script src="script.js"></script>
</body>
</html>
